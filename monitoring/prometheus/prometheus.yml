global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['localhost:9100']

  - job_name: dayz-server
    scrape_interval: 15s
    static_configs:
      - targets: ['192.0.2.10:9100']
        labels:
          server: dayz
          environment: lab